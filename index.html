<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ボトムディフェンダー：センチピード・サバイバー</title>
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background-color: #050510; color: #fff;
    font-family: 'Helvetica Neue', Arial, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }
  canvas { display: block; }
  
  /* Main UI */
  #ui {
    position: absolute; top: 15px; left: 15px; pointer-events: none;
    text-shadow: 0 0 5px rgba(0,0,0,1); z-index: 10; text-align: left;
  }
  h2 { margin: 0 0 5px 0; font-size: 18px; color: #00ff88; }
  p { margin: 3px 0; font-size: 14px; font-weight: bold; }
  .text-green { color: #00ff88; }
  .text-yellow { color: #ffeb3b; }
  .text-blue { color: #00e5ff; }
  .text-red { color: #ff3366; }

  /* Version */
  #version {
    position: absolute; bottom: 15px; left: 15px;
    color: rgba(255,255,255,0.5); font-size: 14px;
    font-weight: bold; pointer-events: none; z-index: 10;
  }

  /* Right UI (Vertical arrangement) */
  #right-ui-container {
    position: absolute; bottom: 15px; right: 15px; top: auto;
    display: flex; flex-direction: column; gap: 10px;
    pointer-events: none; z-index: 15; width: 100px;
  }
  .action-btn {
    pointer-events: auto;
    padding: 10px 5px; font-size: 12px; font-weight: bold;
    border: 2px solid #fff; border-radius: 8px;
    background: rgba(0,0,0,0.6); color: #fff;
    backdrop-filter: blur(4px); text-align: center;
    box-shadow: none; transition: transform 0.1s, opacity 0.2s;
    cursor: pointer; width: 100%;
  }
  .action-btn:active { transform: translateY(2px); }
  
  #missile-status {
    padding: 8px 5px; font-size: 11px; font-weight: bold;
    border: 2px solid #ff00ff; border-radius: 8px;
    background: rgba(0,0,0,0.6); color: #ff00ff;
    text-align: center;
  }

  #btnPause {
    position: absolute; top: 15px; right: 15px; bottom: auto; width: 80px; z-index: 15; pointer-events: auto;
  }

  #gameover {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    display: none; text-align: center; background: rgba(5,5,15,0.95);
    padding: 30px; border-radius: 15px; border: 2px solid #ff3366;
    box-shadow: 0 0 20px rgba(255,51,102,0.4); z-index: 20; width: 80%; max-width: 350px;
  }
  #gameover h1 { margin-top: 0; color: #ff3366; font-size: 28px;}
  #gameover button {
    padding: 15px 20px; font-size: 18px; cursor: pointer; margin-top: 20px;
    background: #00ff88; color: #000; border: none; font-weight: bold;
    border-radius: 10px; width: 100%; box-shadow: 0 4px 0 #00cc6a;
  }
  
  #start-screen {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(5,5,16,0.95); z-index: 100;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    cursor: pointer;
  }
  #start-screen h1 { color: #00ff88; font-size: 40px; animation: blink 1s infinite; text-shadow: 0 0 10px #00ff88; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
</style>
</head>
<body>

<div id="start-screen">
  <h1>TAP TO START</h1>
  <p>※音が鳴ります</p>
</div>

<div id="version">ver.1</div>

<div id="ui">
  <h2>防衛コア HP: <span id="hp" class="text-red">100</span> | Lv: <span id="level">1</span></h2>
  <p>EXP: <span id="exp">0</span> / <span id="maxExp">10</span></p>
  <p>生存時間: <span id="time">0</span> 秒</p>
  <p id="defenseUI" style="color: #ff00ff; margin: 3px 0; font-size: 14px; font-weight: bold; display: none;">防御力UP: 残り <span id="defenseDisp">0</span> 秒</p>
  <p class="text-green">基本攻撃 (Lv <span id="baseLv">1</span>) - 自動連射</p>
  <p class="text-yellow">回転剣 (Lv <span id="swordLv">0</span>) - 3秒毎</p>
  <p class="text-blue">射出刃 (Lv <span id="bladeLv">0</span>) - 3秒毎</p>
  <p style="color: #ff9800; margin: 3px 0; font-size: 14px; font-weight: bold;">追従ハエ: <span id="flyCount">0</span> 匹</p>
  <p style="color: #b388ff; margin: 3px 0; font-size: 14px; font-weight: bold;">召使ハエ: <span id="servantFlyCount">0</span> 匹</p>
  <p id="missileUI" style="color: #ff00ff; margin: 3px 0; font-size: 14px; font-weight: bold; display: none;">ミサイル (Lv <span id="missileLvDisp">0</span>) - <span id="missileCdDisp">40秒</span></p>
</div>

<div id="right-ui-container">
  <button id="btnBarrier" class="action-btn" style="border-color: #00ffff; color: #00ffff;">バリア (0/1)</button>
  <button id="btnDecoy" class="action-btn" style="border-color: #00ff00; color: #00ff00;">デコイ (0/2)</button>
  <button id="btnLaser" class="action-btn" style="border-color: #ff3333; color: #ff3333;">レーザー (0/1)</button>
  <button id="btnBomb" class="action-btn" style="border-color: #ff5500; color: #ff5500;">ボム (0)</button>
</div>

<button id="btnPause" class="action-btn" style="border-color: #fff; color: #fff;">一時停止</button>

<div id="gameover">
  <h1>コア破壊...</h1>
  <p>生存時間: <span id="finalTime">0</span>秒</p>
  <p>コア Lv: <span id="finalLevel">1</span></p>
  <button id="restartBtn">システム再起動</button>
</div>

<canvas id="gameCanvas"></canvas>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let audioCtx;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}
function playSound(type) {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gainNode = audioCtx.createGain();
  osc.connect(gainNode);
  gainNode.connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  
  if (type === 'shoot') {
    osc.type = 'square'; osc.frequency.setValueAtTime(880, now); osc.frequency.exponentialRampToValueAtTime(110, now + 0.1);
    gainNode.gain.setValueAtTime(0.03, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
    osc.start(now); osc.stop(now + 0.1);
  } else if (type === 'hit') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(440, now); gainNode.gain.setValueAtTime(0.02, now); 
    gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.05); osc.start(now); osc.stop(now + 0.05);
  } else if (type === 'explosion') {
    osc.type = 'sawtooth'; osc.frequency.setValueAtTime(110, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.3);
    gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
    osc.start(now); osc.stop(now + 0.3);
  } else if (type === 'item') {
    osc.type = 'sine'; osc.frequency.setValueAtTime(880, now); osc.frequency.setValueAtTime(1760, now + 0.05);
    gainNode.gain.setValueAtTime(0.05, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.15);
    osc.start(now); osc.stop(now + 0.15);
  } else if (type === 'levelup') {
    osc.type = 'square'; osc.frequency.setValueAtTime(440, now); osc.frequency.setValueAtTime(880, now + 0.3);
    gainNode.gain.setValueAtTime(0.1, now); gainNode.gain.linearRampToValueAtTime(0, now + 0.6);
    osc.start(now); osc.stop(now + 0.6);
  } else if (type === 'missile') {
    osc.type = 'square'; osc.frequency.setValueAtTime(50, now); osc.frequency.exponentialRampToValueAtTime(10, now + 1.5);
    gainNode.gain.setValueAtTime(0.3, now); gainNode.gain.exponentialRampToValueAtTime(0.001, now + 1.5);
    osc.start(now); osc.stop(now + 1.5);
  }
}

let cw, ch;
function resize() {
  cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight;
  if(player) {
    player.y = ch - 130; player.x = Math.max(player.radius, Math.min(cw - player.radius, player.x));
  }
}
window.addEventListener('resize', resize);

let player, centipedes, bullets, items, gems, particles, flies, servantFlies, turrets, cellTurrets, bombs, damageTexts, decoys;
let goldenFlies = [];
let frame, isGameOver, isPaused, difficultyFrame = 0, targetX = 0;
let missileExplosionTimer = 0;
const COOLDOWN = 180;
const MISSILE_COOLDOWN = 2400; // 40 seconds at 60fps

function initGame() {
  cw = canvas.width = window.innerWidth; ch = canvas.height = window.innerHeight;
  targetX = cw / 2;
  
  player = {
    x: cw/2, y: ch - 130, radius: 20, hp: 100,
    level: 1, exp: 0, nextExp: 10,
    baseTimer: 0, baseInterval: 20,
    swordLv: 0, swordTimer: 0,
    swordSwing: { active: false, timer: 0, duration: 20, hitSet: new Set() },
    bladeLv: 0, bladeTimer: 0,
    laserStock: 0, bombStock: 0, decoyStock: 0, barrierStock: 0,
    powerUpTimer: 0, barrierTimer: 0,
    missileLv: 0, missileTimer: 0
  };
  
  centipedes = []; bullets = []; items = []; gems = []; particles = []; flies = []; servantFlies = []; goldenFlies = []; turrets = []; cellTurrets = []; bombs = []; damageTexts = []; decoys = [];
  
  // Bonus Block
  items.push({ x: cw/2, y: -50, type: 'bonusBlock', radius: 20, hp: 10, isDouble: false });
  
  frame = 0; difficultyFrame = 0; isGameOver = false; isPaused = false; missileExplosionTimer = 0;
  document.getElementById('btnPause').innerText = "一時停止";
  document.getElementById('gameover').style.display = 'none';
  document.getElementById('missileUI').style.display = 'none';
  updateUI(); loop();
}

function updatePointer(e) {
  if (isGameOver || isPaused) return;
  if (e.target && e.target.tagName && e.target.tagName.toUpperCase() === 'BUTTON') return;
  let clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
  targetX = Math.max(player.radius, Math.min(cw - player.radius, clientX));
}
window.addEventListener('mousemove', updatePointer);
window.addEventListener('touchmove', updatePointer, {passive: false});
window.addEventListener('touchstart', updatePointer, {passive: false});
document.addEventListener('touchmove', e => {
  if (e.target && e.target.tagName !== 'BUTTON') e.preventDefault();
}, {passive: false});

function stopProp(e) { e.stopPropagation(); }
const btnLaser = document.getElementById('btnLaser');
const btnBomb = document.getElementById('btnBomb');
const btnDecoy = document.getElementById('btnDecoy');
const btnBarrier = document.getElementById('btnBarrier');

['touchstart', 'mousedown'].forEach(ev => {
  btnLaser.addEventListener(ev, stopProp, {passive: false});
  btnBomb.addEventListener(ev, stopProp, {passive: false});
  btnDecoy.addEventListener(ev, stopProp, {passive: false});
  btnBarrier.addEventListener(ev, stopProp, {passive: false});
});

btnLaser.addEventListener('click', () => {
  if (isGameOver || isPaused || player.laserStock <= 0) return;
  player.laserStock--; turrets.push({ x: player.x, y: player.y, life: 300, width: 24 }); playSound('item'); updateUI();
});
btnBomb.addEventListener('click', () => {
  if (isGameOver || isPaused || player.bombStock <= 0) return;
  player.bombStock--; bombs.push({ x: player.x, y: player.y, radius: 10, maxRadius: Math.min(cw, ch) * 0.8, life: 30, maxLife: 30, hitSet: new Set() }); playSound('explosion'); updateUI();
});
btnDecoy.addEventListener('click', () => {
  if (isGameOver || isPaused || player.decoyStock <= 0) return;
  player.decoyStock--; decoys = [{ x: cw * 0.5, y: ch - 250, life: 900 }]; playSound('item'); updateUI();
});
btnBarrier.addEventListener('click', () => {
  if (isGameOver || isPaused || player.barrierStock <= 0) return;
  player.barrierStock--; player.barrierTimer = 180; playSound('item'); updateUI();
});
document.getElementById('btnPause').addEventListener('click', (e) => {
  if (isGameOver) return;
  isPaused = !isPaused; e.target.innerText = isPaused ? "再開" : "一時停止";
});
document.getElementById('restartBtn').addEventListener('click', initGame);
document.getElementById('start-screen').addEventListener('click', function() {
  initAudio(); this.style.display = 'none'; initGame();
});

function loop() {
  if (isGameOver) return;
  requestAnimationFrame(loop);
  if (isPaused) {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)'; ctx.fillRect(0, 0, cw, ch);
    ctx.fillStyle = '#fff'; ctx.font = "bold 40px 'Helvetica Neue', sans-serif";
    ctx.textAlign = "center"; ctx.fillText("PAUSED", cw / 2, ch / 2); ctx.textAlign = "left"; return;
  }
  
  if (player.barrierTimer > 0) player.barrierTimer--;
  if (player.powerUpTimer > 0) player.powerUpTimer--;

  player.x += (targetX - player.x) * 0.3;
  ctx.fillStyle = 'rgba(5, 5, 16, 0.4)'; ctx.fillRect(0, 0, cw, ch);
  
  difficultyFrame += (player.level >= 13) ? 0.3 : 1;

  handleSpawns(); handleWeapons(); updateBullets(); updateCentipedes();
  updateItems(); updateGems(); updateFlies(); updateGoldenFlies(); updateServantFlies();
  updateTurrets(); updateCellTurrets(); updateBombs(); updateDecoys(); updateParticles(); updateDamageTexts();
  
  handleMissile();
  drawPlayer();
  
  frame++; if (frame % 30 === 0) updateUI();
}

function addDamageText(x, y, damage, isCrit = false) {
  damageTexts.push({ x: x + (Math.random()-0.5)*20, y: y, text: Math.floor(damage) + (isCrit ? "!" : ""), life: 40, maxLife: 40, dy: -1 - Math.random(), isCrit: isCrit });
}
function updateDamageTexts() {
  for (let i = damageTexts.length - 1; i >= 0; i--) {
    let dt = damageTexts[i]; dt.y += dt.dy; dt.life--;
    let alpha = Math.max(0, dt.life / dt.maxLife); let color = dt.isCrit ? `255, 51, 51` : `255, 255, 255`; let shadow = dt.isCrit ? `255, 0, 0` : `255, 51, 102`;
    ctx.fillStyle = `rgba(${color}, ${alpha})`; ctx.shadowBlur = dt.isCrit ? 8 : 4; ctx.shadowColor = `rgba(${shadow}, ${alpha})`;
    ctx.font = dt.isCrit ? "bold 22px 'Helvetica Neue', sans-serif" : "bold 16px 'Helvetica Neue', sans-serif";
    ctx.fillText(dt.text, dt.x, dt.y);
    if (dt.life <= 0) damageTexts.splice(i, 1);
  }
  ctx.shadowBlur = 0;
}

function getNearestEnemy(refX = player.x, refY = player.y) {
  let nearest = null; let minDist = Infinity;
  for (let c of centipedes) {
    for (let seg of c) {
      if (seg.y >= 0) {
        let d = Math.hypot(refX - seg.x, refY - seg.y);
        if (d < minDist) { minDist = d; nearest = seg; }
      }
    }
  }
  return nearest;
}

function handleWeapons() {
  let nearestTarget = getNearestEnemy();
  player.baseTimer++;
  if (player.baseTimer >= player.baseInterval && nearestTarget) {
    let angle = Math.atan2(nearestTarget.y - player.y, nearestTarget.x - player.x);
    let numShots = player.level >= 5 ? 3 : (player.level >= 3 ? 2 : 1);
    let baseDamage = 28 + (player.level * 2); // Cell base 28
    for (let i = 0; i < numShots; i++) {
      let spread = numShots === 2 ? (i===0 ? -0.15 : 0.15) : (numShots === 3 ? (i-1)*0.15 : 0);
      bullets.push({ x: player.x, y: player.y - player.radius, vx: Math.cos(angle+spread)*12, vy: Math.sin(angle+spread)*12, type: 'base', radius: 4 + (player.level > 1 ? 1 : 0), damage: baseDamage, active: true });
    }
    playSound('shoot'); player.baseTimer = 0;
  }

  if (player.swordLv > 0) {
    player.swordTimer++;
    if (player.swordTimer >= COOLDOWN) { player.swordTimer = 0; player.swordSwing.active = true; player.swordSwing.timer = 0; player.swordSwing.hitSet.clear(); }
  }

  if (player.bladeLv > 0) {
    player.bladeTimer++;
    if (player.bladeTimer >= COOLDOWN && nearestTarget) {
      player.bladeTimer = 0; let angle = Math.atan2(nearestTarget.y - player.y, nearestTarget.x - player.x);
      let bladeDamage = 15 + player.bladeLv * 5; let bladeCount = 1 + Math.floor(player.level / 10);
      for (let i = 0; i < bladeCount; i++) {
        let a = angle - (0.2 * (bladeCount - 1))/2 + i * 0.2;
        bullets.push({ x: player.x, y: player.y, vx: Math.cos(a)*6, vy: Math.sin(a)*6, type: 'blade', radius: 15 + Math.min(player.bladeLv, 5)*3, damage: bladeDamage, angle: 0, hitSet: new Set(), active: true });
      }
      playSound('shoot');
    }
  }

  if (player.swordSwing.active) {
    let sw = player.swordSwing; sw.timer++; let prog = sw.timer / sw.duration;
    let a = -Math.PI + prog * Math.PI * 2; let rad = 40 + player.swordLv * 5; let dmg = (20 + player.swordLv * 10) * 0.85; // 85% dmg
    ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(a); ctx.fillStyle = '#ffeb3b';
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(rad, -10); ctx.lineTo(rad + 15, 0); ctx.lineTo(rad, 10); ctx.closePath();
    ctx.shadowBlur = 15; ctx.shadowColor = '#ffeb3b'; ctx.fill(); ctx.restore();
    centipedes.forEach(c => c.forEach(seg => {
      if (!sw.hitSet.has(seg) && seg.y >= 0 && Math.hypot(player.x - seg.x, player.y - seg.y) < rad + seg.radius) {
        seg.hp -= dmg; seg.flashTimer = 5; sw.hitSet.add(seg); spawnParticles(seg.x, seg.y, '#ffeb3b'); addDamageText(seg.x, seg.y, dmg); playSound('hit');
      }
    }));
    if (sw.timer >= sw.duration) sw.active = false;
  }
}

function handleMissile() {
  if (player.missileLv > 0) {
    player.missileTimer++;
    if (player.missileTimer >= MISSILE_COOLDOWN) {
      // Fire missile
      player.missileTimer = 0;
      missileExplosionTimer = 60; // visual effect duration
      playSound('missile');
      let dmg = 150 + (player.missileLv - 1) * 0.5;
      
      centipedes.forEach(c => {
        c.forEach(seg => {
          if (seg.y >= 0 && seg.y < ch / 2) {
            seg.hp -= dmg; seg.flashTimer = 10;
            spawnParticles(seg.x, seg.y, '#ff0000');
            addDamageText(seg.x, seg.y, dmg, true);
          }
        });
      });
    }
  }

  // Draw Missile Explosion
  if (missileExplosionTimer > 0) {
    missileExplosionTimer--;
    let prog = 1 - (missileExplosionTimer / 60);
    let maxRadius = Math.max(cw, ch / 2) * 0.8;
    let radius = maxRadius * Math.pow(prog, 0.5);
    
    ctx.save();
    ctx.globalAlpha = (missileExplosionTimer / 60) * 0.6;
    
    let gradient = ctx.createRadialGradient(cw/2, ch/4, 0, cw/2, ch/4, radius);
    gradient.addColorStop(0, '#ffff00');
    gradient.addColorStop(0.5, '#ff5500');
    gradient.addColorStop(1, '#ff0000');
    
    ctx.beginPath();
    ctx.arc(cw/2, ch/4, radius, 0, Math.PI * 2);
    ctx.fillStyle = gradient;
    ctx.fill();
    
    ctx.globalAlpha = 1.0;
    ctx.fillStyle = '#ffffff';
    ctx.font = "bold 40px 'Helvetica Neue'";
    ctx.textAlign = "center";
    ctx.fillText("MISSILE STRIKE!", cw/2, ch/4);
    ctx.restore();
  }
}

function updateBullets() {
  for (let i = bullets.length - 1; i >= 0; i--) {
    let b = bullets[i];
    if (b.isHoming) {
      let t = getNearestEnemy(b.x, b.y);
      if (t) {
        let ta = Math.atan2(t.y - b.y, t.x - b.x); let ca = Math.atan2(b.vy, b.vx);
        let diff = ta - ca; while (diff > Math.PI) diff -= Math.PI*2; while (diff < -Math.PI) diff += Math.PI*2;
        let s = Math.hypot(b.vx, b.vy); let na = ca + diff * 0.15;
        b.vx = Math.cos(na)*s; b.vy = Math.sin(na)*s;
      }
    }
    b.x += b.vx; b.y += b.vy;
    
    if (b.type === 'base') {
      ctx.fillStyle = '#00ff88'; ctx.shadowBlur = 10; ctx.shadowColor = '#00ff88'; ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2); ctx.fill();
    } else if (b.type === 'blade') {
      b.angle += 0.4; ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(b.angle); ctx.fillStyle = '#00e5ff'; ctx.shadowBlur = 15; ctx.shadowColor = '#00e5ff';
      ctx.beginPath(); for(let j=0; j<8; j++) { let a = (Math.PI*2/8)*j; let r = b.radius; ctx.lineTo(Math.cos(a)*r, Math.sin(a)*r); ctx.lineTo(Math.cos(a+0.2)*(r*0.6), Math.sin(a+0.2)*(r*0.6)); }
      ctx.closePath(); ctx.fill(); ctx.restore();
    }
    ctx.shadowBlur = 0;

    let hit = false;
    // Check hit on BonusBlock
    for (let j = items.length - 1; j >= 0; j--) {
      let item = items[j];
      if (item.type === 'bonusBlock' && Math.hypot(b.x - item.x, b.y - item.y) < b.radius + item.radius) {
        hit = true; item.hp -= b.damage; spawnParticles(item.x, item.y, '#fff'); playSound('hit');
        if(item.hp <= 0) {
          // Drops weapon
          items.splice(j, 1);
          const wps = ['sword', 'blade', 'fly', 'servantFly', 'laser', 'bomb', 'cellTurret'];
          items.push({ x: item.x, y: item.y, type: wps[Math.floor(Math.random() * wps.length)], radius: 10, isDouble: false });
        }
        break;
      }
    }

    if (!hit) {
      for (let c = 0; c < centipedes.length; c++) {
        let cent = centipedes[c];
        for (let s = 0; s < cent.length; s++) {
          let seg = cent[s];
          if (seg.y >= 0) {
            if (b.type === 'base') {
              if (Math.hypot(b.x - seg.x, b.y - seg.y) < b.radius + seg.radius) {
                seg.hp -= b.damage; seg.flashTimer = 5; hit = true; spawnParticles(seg.x, seg.y, '#00ff88'); addDamageText(seg.x, seg.y, b.damage); playSound('hit'); break;
              }
            } else if (b.type === 'blade') {
              if (!b.hitSet.has(seg) && Math.hypot(b.x - seg.x, b.y - seg.y) < b.radius + seg.radius) {
                seg.hp -= b.damage; seg.flashTimer = 5; b.hitSet.add(seg); spawnParticles(seg.x, seg.y, '#00e5ff'); addDamageText(seg.x, seg.y, b.damage); playSound('hit');
              }
            }
          }
        }
        if (hit) break;
      }
    }
    if (hit || b.x < -50 || b.x > cw+50 || b.y > ch+50 || b.y < -50) bullets.splice(i, 1);
  }
}

function handleSpawns() {
  let mult = player.level >= 15 ? 2 : 1;
  let sr = Math.max(240, 600 - Math.floor(difficultyFrame / 30));
  let spawnRate = Math.max(1, Math.floor(sr / mult));
  
  if (frame % spawnRate === 0) {
    let len = 40 + Math.floor(Math.random() * (difficultyFrame/300 + 20));
    if (player.level >= 10) len = Math.floor(len * 2); // count x2
    let x = Math.random() * cw; let y = -50; let cent = [];
    let hpM = 1 + Math.floor(difficultyFrame / 1800) * 0.5;
    let bHp = (27 + difficultyFrame / 25) * hpM; // base 27
    let wp = Math.random() * Math.PI * 2;
    let isGolden = (player.level >= 15 && Math.random() < 0.15);
    if (isGolden) bHp *= 2; 
    
    for (let i = 0; i < len; i++) {
      cent.push({ x: x, y: y, radius: i===0?12:9, hp: bHp*(i===0?1.5:1), isHead: i===0, flashTimer: 0, wavePhase: wp, isGolden: isGolden, isBrown: false });
    }
    centipedes.push(cent);
  }

  let brRate = Math.max(300, 700 - Math.floor(difficultyFrame / 20));
  if (frame > 0 && frame % brRate === 0) {
    let len = 30 + Math.floor(Math.random() * 15); let x = Math.random() * cw; let y = -50; let cent = [];
    let bHp = 22.5 * (1 + Math.floor(difficultyFrame / 1800) * 0.5); // base 22.5
    for (let i = 0; i < len; i++) cent.push({ x: x, y: y, radius: i===0?12:9, hp: bHp*(i===0?1.5:1), isHead: i===0, flashTimer: 0, wavePhase: Math.random()*Math.PI*2, isGolden: false, isBrown: true });
    centipedes.push(cent);
  }
}

function updateCentipedes() {
  for (let i = centipedes.length - 1; i >= 0; i--) {
    let cent = centipedes[i]; let deadIndex = -1; ctx.shadowBlur = 10; 
    for (let j = 0; j < cent.length; j++) {
      let seg = cent[j]; ctx.shadowColor = seg.isGolden ? '#ffcc00' : (seg.isBrown ? '#8b4513' : '#ff3366');
      if (seg.flashTimer > 0) seg.flashTimer--;
      if (seg.y > player.y + player.radius) { seg.hp = 0; seg.noDrop = true; } // vanish no drop
      if (seg.hp <= 0 && deadIndex === -1) deadIndex = j;

      let sm = player.level >= 10 ? 1.6 : 1.0;
      let spd = (0.4 + (difficultyFrame / 8000)) * sm * 2; 
      if (seg.isGolden) spd *= 0.5; 
      if (seg.isBrown) spd *= 3; 

      if (j === 0) {
        seg.y += spd * 1.5; 
        let tx = decoys.length > 0 ? decoys[0].x : player.x; let dx = tx - seg.x; let hx = Math.sign(dx) * spd * 1.5;
        if (Math.abs(dx) < spd*1.5) hx = dx; seg.x += hx + Math.sin(frame * 0.02 + seg.wavePhase) * (spd * 4.0);
      } else {
        let ld = cent[j-1]; let dx = ld.x - seg.x; let dy = ld.y - seg.y; let dist = Math.hypot(dx, dy);
        if (dist > 16) { seg.x += (dx/dist)*(dist-16); seg.y += (dy/dist)*(dist-16); }
      }
      seg.x = Math.max(seg.radius, Math.min(cw - seg.radius, seg.x));

      ctx.fillStyle = seg.flashTimer > 0 ? '#fff' : (seg.isGolden ? (seg.isHead?'#fff8b0':'#ffcc00') : (seg.isBrown ? (seg.isHead?'#d2691e':'#8b4513') : (seg.isHead?'#ff6666':'#cc0033')));
      ctx.beginPath(); ctx.arc(seg.x, seg.y, seg.radius, 0, Math.PI*2); ctx.fill();
      
      if (Math.hypot(player.x - seg.x, player.y - seg.y) < player.radius + seg.radius) {
        if (player.barrierTimer <= 0) { 
          let baseEnemyDmg = seg.isBrown ? 0.5 : 1.5;
          let actualEnemyDmg = player.powerUpTimer > 0 ? baseEnemyDmg * 0.5 : baseEnemyDmg;
          player.hp -= actualEnemyDmg; 
          playSound('hit'); 
          if (player.hp <= 0) gameOver(); 
        }
        seg.hp -= 5; updateUI();
      }
    }
    ctx.shadowBlur = 0;

    if (deadIndex !== -1) {
      let ds = cent[deadIndex];
      if (!ds.noDrop && ds.y >= 0) {
        playSound('explosion'); spawnParticles(ds.x, ds.y, ds.isGolden?'#ffcc00':(ds.isBrown?'#d2691e':'#ff3366'));
        let isDbl = ds.killedByGoldenFly || false;
        
        if (ds.isBrown) {
          gems.push({ x: ds.x, y: ds.y, radius: 5, isHomingToPlayer: false, value: 3 * (isDbl?2:1), color: '#d2691e' }); // 100% 3x EXP
          if (Math.random() < 0.20) items.push({ x: ds.x, y: ds.y, type: Math.random()<0.5?'fly':'servantFly', radius: 8, isDouble: isDbl });
        } else {
          // Normal EXP gem
          if (Math.random() < 0.60) gems.push({ x: ds.x, y: ds.y, radius: 4, isHomingToPlayer: false, value: 1*(isDbl?2:1), color: isDbl?'#ffcc00':'#00ff88' });
          
          if (ds.isGolden) {
            // Gold enemy drops
            if (Math.random() < 0.01) { goldenFlies.push({ x: ds.x, y: ds.y, life: 300, radius: 5 }); spawnParticles(ds.x, ds.y, '#ffd700'); }
            if (Math.random() < 0.30) items.push({ x: ds.x, y: ds.y, type: 'decoy', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.30) items.push({ x: ds.x, y: ds.y, type: 'barrier', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.30) items.push({ x: ds.x, y: ds.y, type: 'powerUp', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.30) items.push({ x: ds.x, y: ds.y, type: 'cooldownReset', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.30) {
                const wps = ['sword', 'blade', 'fly', 'servantFly', 'laser', 'bomb', 'cellTurret'];
                items.push({ x: ds.x, y: ds.y, type: wps[Math.floor(Math.random() * wps.length)], radius: 8, isDouble: isDbl });
            }
            if (Math.random() < 0.30) items.push({ x: ds.x, y: ds.y, type: 'missile', radius: 8, isDouble: isDbl });
          } else {
            // Normal drops
            if (player.level >= 10 && Math.random() < 0.002) items.push({ x: ds.x, y: ds.y, type: 'decoy', radius: 8, isDouble: isDbl });
            if (player.level >= 14 && Math.random() < 0.002) items.push({ x: ds.x, y: ds.y, type: 'barrier', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.02) items.push({ x: ds.x, y: ds.y, type: 'powerUp', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.02) items.push({ x: ds.x, y: ds.y, type: 'cooldownReset', radius: 8, isDouble: isDbl });
            if (Math.random() < 0.15) {
                const wps = ['sword', 'blade', 'fly', 'servantFly', 'laser', 'bomb', 'cellTurret'];
                items.push({ x: ds.x, y: ds.y, type: wps[Math.floor(Math.random() * wps.length)], radius: 8, isDouble: isDbl });
            }
            if (Math.random() < 0.01) items.push({ x: ds.x, y: ds.y, type: 'missile', radius: 8, isDouble: isDbl });
          }
        }
      }
      let head = cent.slice(0, deadIndex); let tail = cent.slice(deadIndex + 1);
      if (tail.length > 0) { tail[0].isHead = true; tail[0].radius = 12; }
      centipedes.splice(i, 1);
      if (tail.length > 0) centipedes.push(tail); if (head.length > 0) centipedes.push(head);
    }
  }
}

function updateGems() {
  for (let i = gems.length - 1; i >= 0; i--) {
    let g = gems[i]; let dist = Math.hypot(player.x - g.x, player.y - g.y);
    if (dist < 150 || g.isHomingToPlayer) {
      let a = Math.atan2(player.y - g.y, player.x - g.x); let s = g.isHomingToPlayer ? 15 : 7;
      g.x += Math.cos(a)*s; g.y += Math.sin(a)*s;
    }
    let c = g.color || '#00ff88'; ctx.shadowBlur = 8; ctx.shadowColor = c; ctx.fillStyle = c;
    ctx.beginPath(); ctx.arc(g.x, g.y, g.radius, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;

    if (dist < player.radius + g.radius) {
      player.exp += (g.value || 1); playSound('item');
      while (player.exp >= player.nextExp) {
        player.exp -= player.nextExp; player.level++; playSound('levelup');
        let req;
        if (player.level >= 7 && player.level <= 9) req = 90;
        else if (player.level >= 10 && player.level <= 13) req = 130;
        else if (player.level > 13) req = 130 + (player.level - 13) * 20;
        else req = Math.floor(player.nextExp * 1.5);
        
        player.nextExp = player.level >= 100 ? req * 2 : req;
        player.hp = Math.min(100, player.hp + 20);
      }
      gems.splice(i, 1); updateUI();
    }
  }
}

function updateItems() {
  for (let i = items.length - 1; i >= 0; i--) {
    let item = items[i];
    
    if (item.type === 'bonusBlock') {
      item.y += 1; // fall slowly
    } else {
      let dx = player.x - item.x; let dy = player.y - item.y; let dist = Math.hypot(dx, dy); 
      item.x += (dx/dist)*5; item.y += (dy/dist)*5;
    }

    ctx.shadowBlur = item.isDouble ? 18 : 10;
    if (item.type === 'sword') ctx.fillStyle = '#ffeb3b';
    else if (item.type === 'blade') ctx.fillStyle = '#00e5ff';
    else if (item.type === 'fly') ctx.fillStyle = '#ff9800';
    else if (item.type === 'servantFly') ctx.fillStyle = '#b388ff';
    else if (item.type === 'laser') ctx.fillStyle = '#ff3333';
    else if (item.type === 'bomb') ctx.fillStyle = '#ff5500';
    else if (item.type === 'cellTurret') ctx.fillStyle = '#4caf50';
    else if (item.type === 'missile') ctx.fillStyle = '#808080';
    else if (item.type === 'powerUp') ctx.fillStyle = '#ff00ff'; 
    else if (item.type === 'decoy') ctx.fillStyle = '#00ff00'; 
    else if (item.type === 'barrier') ctx.fillStyle = '#00ffff';
    else if (item.type === 'cooldownReset') ctx.fillStyle = '#00ccff';
    else if (item.type === 'bonusBlock') ctx.fillStyle = '#ffff00';
    
    ctx.shadowColor = item.isDouble ? '#ffff00' : ctx.fillStyle;
    
    ctx.save(); ctx.translate(item.x, item.y); 
    if (item.type === 'bonusBlock') {
      ctx.fillRect(-item.radius, -item.radius, item.radius*2, item.radius*2);
      ctx.fillStyle = '#000'; ctx.font = "bold 20px Arial"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("?", 0, 0);
    } else {
      ctx.rotate(frame * 0.1); 
      if (item.type === 'decoy' || item.type === 'cooldownReset') {
          ctx.beginPath(); for (let j = 0; j < 5; j++) { ctx.lineTo(Math.cos((18+j*72)*Math.PI/180)*12, -Math.sin((18+j*72)*Math.PI/180)*12); ctx.lineTo(Math.cos((54+j*72)*Math.PI/180)*6, -Math.sin((54+j*72)*Math.PI/180)*6); }
          ctx.closePath(); ctx.fill();
      } else {
          ctx.beginPath(); ctx.rect(-item.radius, -item.radius, item.radius*2, item.radius*2); ctx.fill();
      }
    }
    ctx.restore(); ctx.shadowBlur = 0;

    let d = Math.hypot(player.x - item.x, player.y - item.y);
    if (item.type === 'bonusBlock' && d < player.radius + item.radius) {
      item.hp -= 10;
      if (item.hp <= 0) {
        items.splice(i, 1);
        const wps = ['sword', 'blade', 'fly', 'servantFly', 'laser', 'bomb', 'cellTurret'];
        items.push({ x: item.x, y: item.y, type: wps[Math.floor(Math.random() * wps.length)], radius: 10, isDouble: false });
        playSound('explosion');
      }
    } else if (item.type !== 'bonusBlock' && d < player.radius + item.radius) {
      playSound('item'); let multAmt = item.isDouble ? 2 : 1; let procType = item.type;
      
      if (procType === 'sword') player.swordLv += multAmt;
      if (procType === 'blade') player.bladeLv += multAmt;
      if (procType === 'fly') for (let k=0; k<multAmt; k++) flies.push({ x: player.x, y: player.y, life: 300, radius: 4 }); 
      if (procType === 'servantFly') for (let k=0; k<multAmt; k++) servantFlies.push({ x: player.x, y: player.y, life: 300, radius: 4 }); 
      if (procType === 'laser') player.laserStock = Math.min(1, player.laserStock + multAmt);
      if (procType === 'bomb') player.bombStock += multAmt;
      if (procType === 'cellTurret') {
        if (cellTurrets.length >= 2) cellTurrets.forEach(ct => ct.isRed = true);
        else { let nIdx = cellTurrets.length === 1 ? (cellTurrets[0].idx===0?1:0) : 0; if (cellTurrets.length===1) cellTurrets[0].isRed = true; cellTurrets.push({ x: nIdx===0?cw*0.75:cw*0.25, y: ch*0.6, life: 1800, timer: 0, idx: nIdx, isRed: false }); }
      }
      if (procType === 'missile') player.missileLv += multAmt;
      if (procType === 'powerUp') player.powerUpTimer = 600; 
      if (procType === 'decoy') player.decoyStock = Math.min(2, player.decoyStock + multAmt);
      if (procType === 'barrier') player.barrierStock = Math.min(1, player.barrierStock + multAmt);
      if (procType === 'cooldownReset') { player.swordTimer = COOLDOWN; player.bladeTimer = COOLDOWN; }
      
      items.splice(i, 1); player.hp = Math.min(100, player.hp + 3 * multAmt); updateUI();
    }
  }
}

function updateGoldenFlies() {
  for (let i = goldenFlies.length - 1; i >= 0; i--) {
    let fly = goldenFlies[i]; fly.life--; let t = getNearestEnemy();
    if (t) {
      let a = Math.atan2(t.y - fly.y, t.x - fly.x); fly.x += Math.cos(a)*7; fly.y += Math.sin(a)*7;
      if (Math.hypot(fly.x - t.x, fly.y - t.y) < fly.radius + t.radius) {
        let d = 2 + (player.level-1)*3; 
        let isCrit = Math.random() < Math.min(0.30, 0.05 + (player.level-1)*0.02); if(isCrit) d*=3;
        t.hp -= d; t.flashTimer = 3; if (t.hp <= 0) t.killedByGoldenFly = true;
        spawnParticles(t.x, t.y, '#ffd700'); if (frame%4===0 || isCrit) addDamageText(t.x, t.y, d, isCrit);
      }
    } else {
      let a = Math.atan2(player.y - fly.y, player.x - fly.x); fly.x += Math.cos(a)*4; fly.y += Math.sin(a)*4;
    }
    fly.x += (Math.random()-0.5)*8; fly.y += (Math.random()-0.5)*8;
    ctx.shadowBlur = 12; ctx.shadowColor = '#ffd700'; ctx.fillStyle = '#ffd700'; ctx.beginPath(); ctx.arc(fly.x, fly.y, fly.radius, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    if (fly.life <= 0) goldenFlies.splice(i, 1);
  }
}

function updateServantFlies() {
  for (let i = servantFlies.length - 1; i >= 0; i--) {
    let fly = servantFlies[i]; fly.life--; let ng = null; let md = Infinity;
    for (let g of gems) { if (g.isHomingToPlayer) continue; let d = Math.hypot(fly.x - g.x, fly.y - g.y); if (d < md) { md = d; ng = g; } }
    if (ng) {
      let a = Math.atan2(ng.y - fly.y, ng.x - fly.x); fly.x += Math.cos(a)*8; fly.y += Math.sin(a)*8;
      if (Math.hypot(fly.x - ng.x, fly.y - ng.y) < fly.radius + ng.radius + 15) ng.isHomingToPlayer = true;
    } else {
      let a = Math.atan2(player.y - fly.y, player.x - fly.x); fly.x += Math.cos(a)*5; fly.y += Math.sin(a)*5;
    }
    fly.x += (Math.random()-0.5)*6; fly.y += (Math.random()-0.5)*6;
    ctx.shadowBlur = 10; ctx.shadowColor = '#b388ff'; ctx.fillStyle = '#b388ff'; ctx.beginPath(); ctx.arc(fly.x, fly.y, fly.radius, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
    if (fly.life <= 0) servantFlies.splice(i, 1);
  }
}

function updateTurrets() {
  for (let i = turrets.length - 1; i >= 0; i--) {
    let t = turrets[i]; t.life--;
    ctx.shadowBlur = 10; ctx.shadowColor = '#ff3333'; ctx.fillStyle = '#ff3333'; ctx.fillRect(t.x - 12, t.y - 10, 24, 20);
    let la = Math.min(1, t.life / 30); ctx.fillStyle = `rgba(255, 51, 51, ${la * 0.6})`; ctx.shadowColor = '#ff3333';
    ctx.fillRect(t.x - t.width/2, 0, t.width, t.y); ctx.fillStyle = `rgba(255, 255, 255, ${la})`; ctx.fillRect(t.x - t.width/4, 0, t.width/2, t.y); ctx.shadowBlur = 0;
    if (frame % 5 === 0) {

          if (seg.y >= 0 && seg.x+seg.radius > t.x-t.width/2 && seg.x-seg.radius < t.x+t.width/2 && seg.y < t.y) {
            let dmg = 5; seg.hp -= dmg; seg.flashTimer = 3; addDamageText(seg.x, seg.y, dmg); spawnParticles(seg.x, seg.y, '#ff3333');
          }

}

function updateCellTurrets() {

    if (ct.timer >= 15) {

function updateBombs() {

function drawPlayer() {
  if (player.powerUpTimer > 0) {
    ctx.shadowBlur = 10; ctx.shadowColor = '#ff00ff'; ctx.fillStyle = 'rgba(255, 0, 255, 0.15)'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 15, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  }
  if (player.barrierTimer > 0) {
    ctx.shadowBlur = 20; ctx.shadowColor = '#00ffff'; ctx.fillStyle = 'rgba(0, 255, 255, 0.4)'; ctx.beginPath(); ctx.arc(player.x, player.y, player.radius + 20, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0;
  }
  ctx.shadowBlur = 15; ctx.shadowColor = '#00ff88'; ctx.save(); ctx.translate(player.x, player.y); ctx.fillStyle = '#ffffff'; ctx.fillRect(-5, -25, 10, 20); ctx.restore();
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius, 0, Math.PI*2); ctx.fillStyle = '#111'; ctx.fill(); ctx.strokeStyle = '#00ff88'; ctx.lineWidth = 3; ctx.stroke();
  ctx.beginPath(); ctx.arc(player.x, player.y, player.radius * 0.5, 0, Math.PI*2); ctx.fillStyle = '#00ff88'; ctx.fill(); ctx.shadowBlur = 0;
}

function spawnParticles(x, y, c) { for (let i=0; i<4; i++) particles.push({ x: x, y: y, vx: (Math.random()-0.5)*6, vy: (Math.random()-0.5)*6, life: 15, color: c }); }
function updateParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    let p = particles[i]; p.x += p.vx; p.y += p.vy; p.life--; ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 15;
    ctx.beginPath(); ctx.arc(p.x, p.y, 3, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1; if (p.life <= 0) particles.splice(i, 1);
  }
}

function updateUI() {
  document.getElementById('hp').innerText = Math.max(0, Math.floor(player.hp));
  document.getElementById('level').innerText = player.level;
  
  if (player.powerUpTimer > 0) {
    document.getElementById('defenseUI').style.display = 'block';
    document.getElementById('defenseDisp').innerText = Math.ceil(player.powerUpTimer / 60);
  } else {
    document.getElementById('defenseUI').style.display = 'none';
  }
  
  document.getElementById('baseLv').innerText = player.level;
  document.getElementById('exp').innerText = player.exp;
  document.getElementById('maxExp').innerText = player.nextExp;
  document.getElementById('time').innerText = Math.floor(frame / 60);
  document.getElementById('swordLv').innerText = player.swordLv;
  document.getElementById('bladeLv').innerText = player.bladeLv;
  document.getElementById('flyCount').innerText = flies.length;
  document.getElementById('servantFlyCount').innerText = servantFlies.length;
  
  const bL = document.getElementById('btnLaser'); const bB = document.getElementById('btnBomb');
  const bD = document.getElementById('btnDecoy'); const bBa = document.getElementById('btnBarrier');
  
  bL.innerText = `レーザー (${player.laserStock}/1)`; bB.innerText = `ボム (${player.bombStock})`;
  bD.innerText = `デコイ (${player.decoyStock}/2)`; bBa.innerText = `バリア (${player.barrierStock}/1)`;
  
  bL.style.opacity = player.laserStock > 0 ? '1' : '0.5'; bB.style.opacity = player.bombStock > 0 ? '1' : '0.5';
  bD.style.opacity = player.decoyStock > 0 ? '1' : '0.5'; bBa.style.opacity = player.barrierStock > 0 ? '1' : '0.5';

  if (player.missileLv > 0) {
    document.getElementById('missileUI').style.display = 'block';
    document.getElementById('missileLvDisp').innerText = player.missileLv;
    let rM = Math.max(0, Math.ceil((MISSILE_COOLDOWN - player.missileTimer) / 60));
    document.getElementById('missileCdDisp').innerText = rM > 0 ? `${rM}秒` : '発射準備OK';
  } else {
    document.getElementById('missileUI').style.display = 'none';
  }
}

function gameOver() {
  isGameOver = true; document.getElementById('gameover').style.display = 'block';
  document.getElementById('finalTime').innerText = Math.floor(frame / 60); document.getElementById('finalLevel').innerText = player.level;
}
</script>
